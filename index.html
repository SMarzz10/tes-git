<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>My To-Do List</h1>
        <p>Atur kegiatanmu agar lebih produktif!</p>

        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Masukkan kegiatan...">
            <button onclick="addTask()">Tambah</button>
        </div>

        <ul id="taskList"></ul>

        <p id="taskCount">0 kegiatan</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
